name: Build and promote release

on:
  workflow_run:
    workflows: [Repository verification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Volledige, reeds geverifieerde main-revision
        required: true
        type: string
      verification_run_id:
        description: Succesvolle Repository verification-run voor exact deze revision
        required: true
        type: string

permissions: {}

concurrency:
  group: pvdd-release-main
  cancel-in-progress: true

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      build_time: ${{ steps.release.outputs.build_time }}
    steps:
      - name: Validate manually supplied verification evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_REVISION: ${{ inputs.revision }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          set -euo pipefail
          actual_revision="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFICATION_RUN_ID}" --jq .head_sha)"
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFICATION_RUN_ID}" --jq .conclusion)"
          test "$conclusion" = success
          test "$actual_revision" = "$VERIFIED_REVISION"
      - id: release
        env:
          VERIFIED_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.workflow_run.head_sha }}
        run: |
          echo "revision=${VERIFIED_REVISION}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  backend:
    needs: metadata
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs: {digest: "${{ steps.image.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.metadata.outputs.revision }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robbertvdzon/pvdd-backend:sha-${{ needs.metadata.outputs.revision }}
          build-args: |
            APP_VERSION=0.1.0
            GIT_REVISION=${{ needs.metadata.outputs.revision }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
          cache-from: type=gha,scope=pvdd-backend
          cache-to: type=gha,mode=max,scope=pvdd-backend

  frontend:
    needs: metadata
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      acceptance_digest: ${{ steps.acceptance-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.metadata.outputs.revision }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robbertvdzon/pvdd-frontend:sha-${{ needs.metadata.outputs.revision }}
          build-args: |
            APP_VERSION=0.1.0
            GIT_REVISION=${{ needs.metadata.outputs.revision }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            ENVIRONMENT=production
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=pvdd-frontend
          cache-to: type=gha,mode=max,scope=pvdd-frontend
      - id: acceptance-image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robbertvdzon/pvdd-frontend:sha-${{ needs.metadata.outputs.revision }}-acceptance
          build-args: |
            APP_VERSION=0.1.0
            GIT_REVISION=${{ needs.metadata.outputs.revision }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            ENVIRONMENT=acceptance
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          cache-from: type=gha,scope=pvdd-frontend
          cache-to: type=gha,mode=max,scope=pvdd-frontend

  meeting-source-mock:
    needs: metadata
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    outputs: {digest: "${{ steps.image.outputs.digest }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.metadata.outputs.revision }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: meeting-source-mock
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robbertvdzon/pvdd-meeting-source-mock:sha-${{ needs.metadata.outputs.revision }}
          cache-from: type=gha,scope=pvdd-meeting-source-mock
          cache-to: type=gha,mode=max,scope=pvdd-meeting-source-mock

  promote:
    needs: [metadata, backend, frontend, meeting-source-mock]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: imranismail/setup-kustomize@v2
        with: {kustomize-version: "5.8.0"}
      - name: Promote through acceptance to production
        env:
          REVISION: ${{ needs.metadata.outputs.revision }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          ACCEPTANCE_FRONTEND_DIGEST: ${{ needs.frontend.outputs.acceptance_digest }}
          MOCK_DIGEST: ${{ needs.meeting-source-mock.outputs.digest }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$REVISION" ]]; then
            echo "Release $REVISION is vervangen door een nieuwere main; promotie overgeslagen."
            exit 0
          fi

          wait_for_environment() {
            local environment="$1" deadline=$((SECONDS + 600)) output=''
            while (( SECONDS < deadline )); do
              if output="$(timeout 30s tools/smoke-test.sh "$environment" "$REVISION" 2>&1)"; then echo "$output"; return 0; fi
              sleep 10
            done
            echo "$output" >&2
            return 1
          }

          (cd deploy/overlays/acceptance && kustomize edit set image \
            "ghcr.io/robbertvdzon/pvdd-backend=ghcr.io/robbertvdzon/pvdd-backend@${BACKEND_DIGEST}" \
            "ghcr.io/robbertvdzon/pvdd-frontend=ghcr.io/robbertvdzon/pvdd-frontend@${ACCEPTANCE_FRONTEND_DIGEST}" \
            "ghcr.io/robbertvdzon/pvdd-meeting-source-mock=ghcr.io/robbertvdzon/pvdd-meeting-source-mock@${MOCK_DIGEST}")
          git add deploy/overlays/acceptance/kustomization.yaml
          git commit -m "deploy: promote $REVISION to acceptance [skip ci]"
          git push origin HEAD:main
          acceptance_commit="$(git rev-parse HEAD)"
          wait_for_environment acceptance

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$acceptance_commit" ]]; then
            echo 'Main wijzigde tijdens acceptatie; productiepromotie overgeslagen.'
            exit 0
          fi
          (cd deploy/overlays/production && kustomize edit set image \
            "ghcr.io/robbertvdzon/pvdd-backend=ghcr.io/robbertvdzon/pvdd-backend@${BACKEND_DIGEST}" \
            "ghcr.io/robbertvdzon/pvdd-frontend=ghcr.io/robbertvdzon/pvdd-frontend@${FRONTEND_DIGEST}")
          git add deploy/overlays/production/kustomization.yaml
          git commit -m "deploy: promote $REVISION to production [skip ci]"
          git push origin HEAD:main
          wait_for_environment production
