name: Repository verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-verification:
    name: Repository verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify documentation and repository hygiene
        run: bash tools/verify-documentation.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        run: mvn -B --no-transfer-progress -f backend/pom.xml clean verify
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Pin exact Flutter revision
        run: |
          git -C "$FLUTTER_ROOT" fetch --depth 1 origin ee80f08bbf97172ec030b8751ceab557177a34a6
          git -C "$FLUTTER_ROOT" checkout --detach ee80f08bbf97172ec030b8751ceab557177a34a6
          flutter --version
      - name: Verify frontend
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test
          bash build-web.sh
      - name: Verify frontend cache contract
        run: bash tools/test-frontend-cache.sh
      - name: Build containers
        run: |
          docker build -t pvdd-backend:verify backend
          docker build -t pvdd-frontend:verify frontend
      - name: Render Kustomize overlays when present
        run: |
          if [[ -d deploy/overlays/acceptance ]]; then kubectl kustomize deploy/overlays/acceptance >/dev/null; fi
          if [[ -d deploy/overlays/production ]]; then kubectl kustomize deploy/overlays/production >/dev/null; fi
