apiVersion: v1
kind: ConfigMap
metadata:
  name: pvdd-config
data:
  PVDD_ENVIRONMENT: production
  PVDD_AUTH_MODE: google
  PVDD_AUTH_SESSION_DAYS: "180"
  PVDD_TOOLING_AUTH_ENABLED: "true"
  PVDD_DATABASE_URL: jdbc:postgresql://database:5432/pvdd
  PVDD_AGENT_RUNTIME_BASE_URL: http://agent-runtime-server.agent-runtime.svc.cluster.local
  PVDD_AGENT_RUNTIME_PROVIDER: CODEX
  PVDD_AGENT_RUNTIME_MODEL: gpt-5.6-sol
  PVDD_MEETING_SOURCE_BASE_URL: https://noordholland.bestuurlijkeinformatie.nl
  PVDD_POLICY_SOURCE_URL: https://assets.partijvoordedieren.nl/assets/site/noordHolland/PvdDNH-programma-PS23.pdf
  PVDD_POLICY_SYNC_START_URLS: https://noordholland.partijvoordedieren.nl/onze-idealen,https://noordholland.partijvoordedieren.nl/nieuws,https://noordholland.partijvoordedieren.nl/bijdragen,https://noordholland.partijvoordedieren.nl/moties,https://noordholland.partijvoordedieren.nl/vragen,https://noordholland.partijvoordedieren.nl/verkiezingsprogramma-partij-voor-de-dieren-provinciale-staten-2023-2027,https://assets.partijvoordedieren.nl/assets/site/noordHolland/PvdDNH-programma-PS23.pdf
