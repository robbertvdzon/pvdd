apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvdd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: backend}
spec:
  replicas: 1
  strategy: {type: RollingUpdate}
  selector:
    matchLabels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: backend}
    spec:
      serviceAccountName: pvdd
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/robbertvdzon/pvdd-backend:unreleased
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: pvdd-config}
            - secretRef: {name: pvdd-secrets}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
      volumes:
        - name: temporary-files
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: backend}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: frontend}
    spec:
      serviceAccountName: pvdd
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: ghcr.io/robbertvdzon/pvdd-frontend:unreleased
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          startupProbe:
            httpGet: {path: /version.json, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /index.html, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /version.json, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
      volumes:
        - name: temporary-files
          emptyDir: {sizeLimit: 32Mi}
        - name: nginx-cache
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app.kubernetes.io/name: pvdd, app.kubernetes.io/component: frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
