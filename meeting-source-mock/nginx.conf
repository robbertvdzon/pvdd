server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health/live {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"UP"}';
    }

    location = /health/ready {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"UP"}';
    }

    location = /Agenda/RetrieveAgendasForYear {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/year.html =404;
    }

    location = /Agenda/Index/acceptance-meeting-v1 {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/agenda.html =404;
    }

    location = /Reports/Item/report-nature {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/report-nature.html =404;
    }

    location = /Agenda/Document/acceptance-meeting-v1 {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        if ($arg_documentId = doc-mobility) { rewrite ^ /fixtures/doc-mobility.html last; }
        try_files /fixtures/doc-housing.txt =404;
    }

    location = /Reports/Document/report-nature {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/doc-nature.txt =404;
    }

    location = /Document/View/doc-housing {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/doc-housing.txt =404;
    }

    location = /Document/View/doc-mobility {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/doc-mobility.html =404;
    }

    location = /Document/View/doc-nature {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/doc-nature.txt =404;
    }

    location = /fixtures/policy.pdf {
        default_type application/pdf;
        add_header Cache-Control "no-store" always;
        try_files /fixtures/policy.pdf =404;
    }

    location = /fixtures/scenarios/source-error {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"synthetic_source_failure"}';
    }

    location /fixtures/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / { return 404; }
}
