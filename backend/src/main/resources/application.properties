spring.application.name=pvdd-commissie-assistent
pvdd.version=${PVDD_APP_VERSION:0.1.0-SNAPSHOT}
pvdd.git-revision=${PVDD_GIT_REVISION:local}
pvdd.build-time=${PVDD_BUILD_TIME:unknown}
pvdd.environment=${PVDD_ENVIRONMENT:local}
spring.datasource.url=${PVDD_DATABASE_URL:jdbc:postgresql://localhost:5432/pvdd}
spring.datasource.username=${PVDD_DATABASE_USER:pvdd}
spring.datasource.password=${PVDD_DATABASE_PASSWORD:local-development-only}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
