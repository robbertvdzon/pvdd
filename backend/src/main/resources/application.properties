spring.application.name=pvdd-commissie-assistent
pvdd.version=${PVDD_APP_VERSION:0.1.0-SNAPSHOT}
pvdd.git-revision=${PVDD_GIT_REVISION:local}
pvdd.build-time=${PVDD_BUILD_TIME:unknown}
pvdd.environment=${PVDD_ENVIRONMENT:local}
pvdd.acceptance-run-on-startup=${PVDD_ACCEPTANCE_RUN_ON_STARTUP:false}
pvdd.auth.google-client-id=${PVDD_GOOGLE_CLIENT_ID:}
pvdd.agent-runtime.base-url=${PVDD_AGENT_RUNTIME_BASE_URL:http://localhost:18089}
pvdd.agent-runtime.token=${PVDD_AGENT_RUNTIME_TOKEN:local-pvdd-token}
pvdd.agent-runtime.provider=${PVDD_AGENT_RUNTIME_PROVIDER:MOCKED}
pvdd.agent-runtime.model=${PVDD_AGENT_RUNTIME_MODEL:mock-model}
pvdd.agent-runtime.environment=${PVDD_ENVIRONMENT:local}
pvdd.agent-runtime.connect-timeout=${PVDD_AGENT_RUNTIME_CONNECT_TIMEOUT:1s}
pvdd.agent-runtime.request-timeout=${PVDD_AGENT_RUNTIME_REQUEST_TIMEOUT:3s}
pvdd.agent-runtime.self-test-timeout=${PVDD_AGENT_RUNTIME_SELF_TEST_TIMEOUT:15s}
pvdd.meeting-source.base-url=${PVDD_MEETING_SOURCE_BASE_URL:http://localhost:18091}
pvdd.meeting-source.environment=${PVDD_ENVIRONMENT:local}
pvdd.meeting-source.agenda-type-id=${PVDD_MEETING_AGENDA_TYPE_ID:1100617069}
pvdd.meeting-source.connect-timeout=${PVDD_MEETING_SOURCE_CONNECT_TIMEOUT:2s}
pvdd.meeting-source.request-timeout=${PVDD_MEETING_SOURCE_REQUEST_TIMEOUT:5s}
pvdd.meeting-source.max-page-bytes=${PVDD_MEETING_SOURCE_MAX_PAGE_BYTES:2097152}
pvdd.document-download.max-documents-per-meeting=${PVDD_MAX_DOCUMENTS_PER_MEETING:80}
pvdd.document-download.max-document-bytes=${PVDD_MAX_DOCUMENT_BYTES:20971520}
pvdd.document-download.max-total-bytes=${PVDD_MAX_TOTAL_DOCUMENT_BYTES:104857600}
pvdd.document-download.max-extracted-characters=${PVDD_MAX_EXTRACTED_CHARACTERS:2000000}
pvdd.document-download.max-pdf-pages=${PVDD_MAX_PDF_PAGES:500}
pvdd.policy-source.url=${PVDD_POLICY_SOURCE_URL:http://localhost:18091/fixtures/policy.pdf}
pvdd.policy-source.environment=${PVDD_ENVIRONMENT:local}
pvdd.policy-source.max-bytes=${PVDD_POLICY_MAX_BYTES:10485760}
pvdd.policy-source.chunk-characters=${PVDD_POLICY_CHUNK_CHARACTERS:2500}
pvdd.analysis.reconcile-delay=${PVDD_ANALYSIS_RECONCILE_DELAY:5s}
spring.datasource.url=${PVDD_DATABASE_URL:jdbc:postgresql://localhost:5432/pvdd}
spring.datasource.username=${PVDD_DATABASE_USER:pvdd}
spring.datasource.password=${PVDD_DATABASE_PASSWORD:local-development-only}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
logging.structured.format.console=ecs
